name: Unzip
on: [push]
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o HafizQuranAndroid-Starter-1.zip
          rm HafizQuranAndroid-Starter-1.zip
          rm -rf HafizQuranAndroid-Starter-1/.git
          mv HafizQuranAndroid-Starter-1/* . || mv HafizQuranAndroid-Starter-1/.* . || true
          rm -rf HafizQuranAndroid-Starter-1
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "فك ضغط المشروع"
