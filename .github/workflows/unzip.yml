name: فك الضغط
on: push
permissions:
  contents: write
  workflows: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: فك الضغط
        run: |
          unzip -o "*.zip" -d .
          rm -f *.zip
          ls -la
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: فك ضغط المشروع
